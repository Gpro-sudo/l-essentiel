name: Actualiser les actualités

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire-et-publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la sélection éditoriale
        run: python -m unittest discover -s tests
      - name: Actualiser les informations
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
        run: python -m scripts.update_news
      - name: Préparer le site
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp news.json dist/news.json
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Créer l'artefact du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
