name: Actualiser les actualités

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire-et-publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la sélection éditoriale
        run: python -m unittest discover -s tests
      - name: Vérifier le JavaScript de l'interface
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("index.html").read_text(encoding="utf-8")
          js = page.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/essentiel-ui.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/essentiel-ui.js
      - name: Actualiser les informations
        env:
          OPENROUTER_API_KEY: ${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-ai]')) && secrets.OPENROUTER_API_KEY || '' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'liquid/lfm-2.5-2.6b:free' }}
        run: python -m scripts.update_news
      - name: Bilan des actualités et des synthèses IA
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("news.json").read_text(encoding="utf-8"))
          total = data.get("count", 0)
          corroborated = data.get("verification", {}).get("corroborated", 0)
          ai = data.get("aiSummaryCount", 0)
          cached = data.get("aiCachedCount", 0)
          print(f"Actualités recueillies : {total}. Recoupées : {corroborated}. Synthèses IA : {ai} (dont {cached} conservées).")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write(f"### Bilan de L'Essentiel\n\n- Actualités recueillies : **{total}**\n- Événements recoupés : **{corroborated}**\n- Synthèses IA : **{ai}**, dont **{cached}** conservées\n")
          PY
      - name: Installer la synthèse vocale locale (secours mobile)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Préparer le site et ses fichiers audio
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp news.json dist/news.json
          python -m scripts.generate_audio
          test -f dist/audio/manifest.json
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Créer l'artefact du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
